name: CI

# push runs on the default branch only; review branches are covered by the
# pull_request run on the same head.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not go-version-file: go.mod's `go 1.13` would pick a toolchain too
          # old for the runner's GOPROXY (the `|` separator needs Go 1.15). The
          # go directive is being bumped separately.
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
